<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <aside class="panel hold-panel">
        <div class="panel-section" id="hold-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
          <span class="hold-status" id="hold-status"></span>
        </div>
      </aside>

      <div class="board-wrap" id="board-wrap">
        <canvas id="board" width="300" height="600"></canvas>
        <div class="fx-layer" id="fx-layer"></div>
      </div>

      <aside class="panel">
        <div class="panel-section theme-toggle">
          <span class="label">MODO CLARO</span>
          <label class="switch">
            <input type="checkbox" id="theme-toggle" />
            <span class="slider"></span>
          </label>
        </div>

        <div class="panel-section theme-toggle">
          <span class="label">SONIDO</span>
          <label class="switch">
            <input type="checkbox" id="sound-toggle" />
            <span class="slider"></span>
          </label>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section" id="combo-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">—</span>
          <span class="b2b-status" id="b2b-status"></span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd><kbd>Shift</kbd> reservar</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <!-- Récords: solo visibles en game over (se ocultan en pausa) -->
        <div id="gameover-records" class="records-panel hidden">
          <p id="new-record-badge" class="new-record-badge hidden">¡NUEVO RÉCORD!</p>
          <form id="name-form" class="name-form hidden" autocomplete="off">
            <label for="name-input" class="label">¡ENTRASTE AL TOP 5! TU NOMBRE</label>
            <div class="name-row">
              <input type="text" id="name-input" maxlength="12" spellcheck="false" />
              <button type="submit" class="btn-primary">Guardar</button>
            </div>
          </form>
          <table class="records-table" id="gameover-records-table"></table>
          <p class="records-stats" id="gameover-records-stats"></p>
          <button type="button" class="btn-secondary clear-records-btn">Borrar récords</button>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="overlay start-screen">
      <div class="overlay-box">
        <p class="start-title">TETRIS</p>
        <div class="records-panel">
          <span class="label">MEJORES PUNTUACIONES</span>
          <table class="records-table" id="start-records-table"></table>
          <p class="records-stats" id="start-records-stats"></p>
        </div>
        <button type="button" id="play-btn" class="btn-primary">Jugar</button>
        <span class="start-hint">o pulsa <kbd>Enter</kbd></span>
        <button type="button" class="btn-secondary clear-records-btn">Borrar récords</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
