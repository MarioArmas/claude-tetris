<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <aside class="panel hold-panel">
        <div class="panel-section" id="hold-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
          <span class="hold-status" id="hold-status"></span>
        </div>
      </aside>

      <div class="board-wrap" id="board-wrap">
        <canvas id="board" width="300" height="600"></canvas>
        <div class="fx-layer" id="fx-layer"></div>
      </div>

      <aside class="panel">
        <div class="panel-section theme-toggle">
          <span class="label">MODO CLARO</span>
          <label class="switch">
            <input type="checkbox" id="theme-toggle" />
            <span class="slider"></span>
          </label>
        </div>

        <div class="panel-section theme-toggle">
          <span class="label">SONIDO</span>
          <label class="switch">
            <input type="checkbox" id="sound-toggle" />
            <span class="slider"></span>
          </label>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section" id="combo-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">—</span>
          <span class="b2b-status" id="b2b-status"></span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd><kbd>X</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd><kbd>Shift</kbd> reservar</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-menu" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="overlay-box pause-box">
        <p id="pause-title">PAUSA</p>

        <div class="pause-view" id="pause-main">
          <button class="menu-btn primary" id="resume-btn">Reanudar</button>
          <button class="menu-btn" id="pause-restart-btn">Reiniciar</button>
          <button class="menu-btn" id="show-controls-btn">Ver controles</button>
          <div class="level-picker" id="level-picker">
            <span class="label">NIVEL INICIAL</span>
            <div class="level-row">
              <button class="level-btn" id="level-down" aria-label="Bajar nivel inicial">−</button>
              <span class="level-value" id="start-level">1</span>
              <button class="level-btn" id="level-up" aria-label="Subir nivel inicial">+</button>
            </div>
            <span class="level-hint">Se aplica en la próxima partida</span>
          </div>
        </div>

        <div class="pause-view hidden" id="pause-controls">
          <span class="label">CONTROLES</span>
          <div class="menu-controls" id="menu-controls"></div>
          <button class="menu-btn" id="hide-controls-btn">Volver</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
